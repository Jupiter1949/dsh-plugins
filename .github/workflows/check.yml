name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (every package)
        # Only node:test runs in CI — tools/preflight.mjs is host-local
        # (validates the developer's local DSH profile, not portable).
        run: pnpm -r test

      - name: Ensure plugins.json index is up to date
        run: |
          node generate-plugins-index.mjs
          git diff --exit-code plugins.json || (echo "plugins.json is stale — run 'node generate-plugins-index.mjs' and commit" && exit 1)
